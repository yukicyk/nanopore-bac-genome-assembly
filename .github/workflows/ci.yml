name: Snakemake CI

# This workflow is triggered on pushes to the main branch and on pull requests
on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  test-pipeline:
    runs-on: ubuntu-latest
    steps:
      # Step 1: Check out the repository's code
      - name: Check out repository
        uses: actions/checkout@v4

      # Step 2: Set up Mambaforge and cache the environment
      - name: Set up Mambaforge
        uses: conda-incubator/setup-miniconda@v3
        with:
          auto-update-conda: true
          python-version: 3.9
          mamba-version: "*"
          channels: conda-forge,bioconda,defaults
          channel-priority: strict
          use-mamba: true
          environment-file: pipeline/envs/ci.yaml
          activate-environment: ci-env

      # Step 3: Install SRA-Tools (if needed for other tests, can be removed if only dry-run is used)
      - name: Install SRA-Tools
        run: |
          sudo apt-get update
          sudo apt-get install -y sra-toolkit

      # Step 4: Lint the workflow for style and correctness
      - name: Lint Snakefiles
        shell: bash -l {0}
        run: |
          snakemake --snakefile pipeline/Snakefile --lint

      # Step 5: Run a full test of the workflow with a dry-run
      - name: Test workflow with a dry-run
        # NO working-directory key needed here. The runner is already in the repo root.
        shell: bash -l {0} # Ensures the conda env is active
        run: |
          # --- SIMPLIFIED TEST SETUP ---
          # Create the necessary directories
          mkdir -p config data/raw

          # Create a dummy fastq file for the dry-run to find
          echo "@dummy\nACGT\n+\n!!!!" > data/raw/test.fastq.gz

          # Create the RESOLVED sample sheet directly. This is what the pipeline
          # actually reads, and it simplifies the CI test.
          echo -e "sample_id\tplatform\tbiosample\tsrrs\tont_reads\tillumina_r1\tillumina_r2\tbarcode\nTEST_SAMPLE\tont\t\t\tdata/raw/test.fastq.gz\t\t\t" > config/samples.resolved.tsv

          # Now, execute the dry-run. This will build the full DAG.
          # The --all-temp flag can make dry-runs faster by not checking for temp file protection.
          snakemake --snakefile pipeline/Snakefile --use-conda --dry-run --cores 1 --all-temp